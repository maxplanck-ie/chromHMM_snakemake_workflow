executor: cluster-generic
cluster-generic-submit-cmd:
  "mkdir -p logs/{rule};\
  module load slurm && sbatch \
    --partition={resources.partition} \
    --cpus-per-task={threads} \
    --mem-per-cpu={resources.mem} \
    --job-name=chromHMM_{rule}-{wildcards} \
    --output=logs/{rule}/{rule}-{wildcards}-%j-%N.out \
    --time={resources.time} \
    --parsable"
jobs: 20
use-envmodules: True
cluster-generic-cancel-cmd: "ccancel.sh"
latency-wait: 300
printshellcommands: True
default-resources:
  mem: 1G
  time: 1440
  partition: bioinfo
set-resources:
  binarizeBam:
    mem: 20G
  segmentBam:
    mem: 40G
  overlapEnrichment:
    mem: 10G
  neighbourhoodEnrichment:
    mem: 10G
